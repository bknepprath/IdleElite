<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idle Elite Godot Docs - Godot Action Review</title>
  <meta name="idle-elite-doc-scope" content="Godot 4 mobile idle RPG documentation and design reference">
  <link rel="stylesheet" href="docs-nav.css?v=20260616o">
  <link rel="stylesheet" href="docs-theme.css?v=20260616o">
  <style>
    :root {
      --ink: #171615;
      --paper: #f8f1e5;
      --panel: #fffdf8;
      --line: #d9cfbc;
      --muted: #6e6658;
      --gold: #fff2a8;
      --blue: #3aa0ff;
      --red: #e84d4d;
      --shadow: 0 24px 58px rgba(28, 24, 18, 0.22);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(119, 200, 178, 0.08), transparent 22rem),
        linear-gradient(145deg, #171512 0%, #211c17 54%, #11100e 100%);
    }

    .page {
      width: min(100%, 1880px);
      margin: 0 auto;
      padding: 26px clamp(10px, 3vw, 32px) 46px;
    }

    .review-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-tile {
      min-width: 0;
      padding: 10px 12px;
      border: 2px solid rgba(247, 234, 215, 0.28);
      border-radius: 8px;
      background: #26221c;
      color: #f7ead7;
      box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.45);
    }

    .summary-tile strong {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .summary-tile span {
      display: block;
      margin-top: 4px;
      color: #bba88d;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .phone-shell {
      width: 100%;
      margin: 0 auto;
      overflow-x: auto;
      padding: 10px 4px 22px;
    }

    .phone {
      --ink: #171615;
      --paper: #f8f1e5;
      --panel: #fffdf8;
      --line: #d9cfbc;
      --muted: #6e6658;
      --gold: #fff2a8;
      color: var(--ink);
      background: transparent;
    }

    #board {
      width: min(100%, 1460px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .phone-status {
      display: none;
    }

    .skill-screen {
      min-width: 0;
      overflow: hidden;
      border: 8px solid #0e0d0b;
      border-radius: 32px;
      background: var(--paper);
      box-shadow: 0 24px 58px rgba(0, 0, 0, 0.34);
    }

    .skill-screen:last-child {
      border-bottom: 8px solid #0e0d0b;
    }

    .skill-hero {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 174px;
      padding: 20px 20px 18px;
      border-bottom: 2px solid rgba(23, 22, 21, 0.14);
      background:
        linear-gradient(120deg, color-mix(in srgb, var(--skill-color) 18%, #fffdf8), #fffdf8 68%),
        #fffdf8;
      box-shadow: 0 12px 28px rgba(23, 22, 21, 0.12);
    }

    .skill-hero-top {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) 86px;
      gap: 12px;
      align-items: center;
    }

    .skill-icon {
      width: 74px;
      height: 74px;
      padding: 7px;
      border: 4px solid var(--ink);
      border-radius: 18px;
      background: var(--panel);
      object-fit: contain;
      box-shadow: 0 5px 0 rgba(23, 22, 21, 0.24);
    }

    .skill-title {
      min-width: 0;
    }

    .skill-title h2 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 34px;
      line-height: 0.94;
      letter-spacing: 0;
    }

    .skill-title p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.25;
    }

    .regen-ring {
      display: grid;
      place-items: center;
      width: 86px;
      aspect-ratio: 1;
      border: 7px solid var(--ink);
      border-radius: 999px;
      background:
        conic-gradient(var(--skill-color) 0 74%, #eadfcb 74% 100%);
      box-shadow: inset 0 0 0 9px #fffdf8, 0 5px 0 rgba(23, 22, 21, 0.22);
      font-weight: 1000;
    }

    .xp-strip {
      height: 14px;
      margin-top: 16px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: #171615;
      overflow: hidden;
    }

    .xp-strip span {
      display: block;
      width: 62%;
      height: 100%;
      border-radius: inherit;
      background: var(--skill-color);
    }

    .module-stack {
      display: grid;
      gap: 18px;
      padding: 18px 14px 28px;
    }

    .module {
      position: relative;
      min-height: 210px;
      overflow: hidden;
      border: 5px solid var(--ink);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 12px 0 rgba(23, 22, 21, 0.2);
    }

    .module-bg {
      position: absolute;
      inset: 0;
      background-color: var(--skill-color);
      background-image: linear-gradient(rgba(23, 22, 21, 0.34), rgba(23, 22, 21, 0.48)), var(--bg);
      background-position: center;
      background-size: cover;
      transform: scale(1.02);
    }

    .module-body {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 14px;
      min-height: 210px;
      padding: 18px;
      align-items: start;
    }

    .module-art {
      width: 128px;
      aspect-ratio: 1;
      padding: 8px;
      border: 4px solid #eee2ce;
      border-radius: 20px;
      background: #fff;
      object-fit: contain;
      box-shadow: 0 5px 0 rgba(23, 22, 21, 0.28);
    }

    .module-copy {
      min-width: 0;
      display: grid;
      gap: 10px;
    }

    .module-kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      min-height: 24px;
      padding: 4px 8px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--gold);
      color: var(--ink);
      font-size: 11px;
      font-weight: 1000;
      line-height: 1;
      box-shadow: 1px 2px 0 rgba(23, 22, 21, 0.55);
    }

    .badge.dark {
      background: #171615;
      color: #fffdf8;
    }

    .badge.combo {
      background: #e8f4ff;
    }

    .badge.event {
      background: #ffe3a6;
    }

    .pill-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .combo-pill,
    .reward-pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border: 2px solid var(--pill-color, var(--ink));
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.96);
      color: var(--ink);
      font-size: 10px;
      font-weight: 1000;
      line-height: 1.05;
      box-shadow:
        inset 5px 0 0 var(--pill-color, var(--line)),
        1px 2px 0 rgba(23, 22, 21, 0.55);
    }

    .reward-pill {
      background: #f4fff1;
    }

    .event-pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border: 2px solid #8d6425;
      border-radius: 999px;
      background: #fff3d3;
      color: var(--ink);
      font-size: 10px;
      font-weight: 1000;
      line-height: 1.05;
      box-shadow: 1px 2px 0 rgba(23, 22, 21, 0.55);
    }

    .combo-pill small,
    .reward-pill small,
    .event-pill small {
      margin-right: 4px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .module-title {
      margin: 0;
      color: #fff;
      font-size: 27px;
      line-height: 0.98;
      letter-spacing: 0;
      text-shadow:
        -2px -2px 0 var(--ink),
        2px -2px 0 var(--ink),
        -2px 2px 0 var(--ink),
        2px 2px 0 var(--ink),
        0 4px 0 rgba(23, 22, 21, 0.42);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .stat {
      min-width: 0;
      min-height: 46px;
      padding: 6px 5px;
      border: 2px solid rgba(23, 22, 21, 0.88);
      border-radius: 10px;
      background: rgba(255, 253, 248, 0.92);
      text-align: center;
    }

    .stat b,
    .stat span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stat b {
      font-size: 14px;
      line-height: 1.05;
    }

    .stat span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .mastery-line {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      margin-top: 2px;
    }

    .medal {
      width: 42px;
      aspect-ratio: 1;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: radial-gradient(circle at 35% 28%, #fff8cf, #d18b28 58%, #7b4a13);
      box-shadow: 0 4px 0 rgba(23, 22, 21, 0.36);
    }

    .progress {
      height: 17px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: #171615;
      overflow: hidden;
    }

    .progress span {
      display: block;
      width: var(--progress, 34%);
      height: 100%;
      background: var(--skill-color);
    }

    .passive .module-bg {
      background-image:
        linear-gradient(rgba(255, 242, 168, 0.62), rgba(255, 242, 168, 0.72)),
        var(--bg);
    }

    .passive .module-title,
    .area-module .module-title {
      color: #fffdf8;
    }

    .passive .passive-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .upgrade-pill {
      min-height: 48px;
      padding: 7px 5px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: rgba(255, 253, 248, 0.94);
      text-align: center;
      font-weight: 1000;
    }

    .upgrade-pill span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .area-module {
      min-height: 0;
    }

    .area-module .module-body {
      grid-template-columns: 1fr;
      min-height: 0;
      padding: 18px;
    }

    .area-top {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .area-thumb {
      width: 82px;
      aspect-ratio: 1;
      border: 4px solid var(--ink);
      border-radius: 20px;
      background-image: var(--bg);
      background-position: center;
      background-size: cover;
      box-shadow: 0 5px 0 rgba(23, 22, 21, 0.26);
    }

    .method-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .method-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border: 2px solid rgba(23, 22, 21, 0.78);
      border-radius: 14px;
      background: rgba(255, 253, 248, 0.94);
    }

    .method-row.combo-method {
      border-color: var(--skill-color);
      background: rgba(255, 250, 233, 0.97);
    }

    .method-row strong {
      display: block;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .method-row.combo-method strong {
      white-space: normal;
    }

    .method-row span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .method-stat {
      color: var(--ink);
      font-size: 12px;
      font-weight: 1000;
      white-space: nowrap;
    }

    .method-pills {
      margin-top: 7px;
    }

    .method-pills .combo-pill,
    .method-pills .reward-pill {
      min-height: 22px;
      padding: 3px 7px;
      font-size: 9px;
    }

    .identity-card {
      padding: 14px 16px;
      border: 3px solid var(--ink);
      border-radius: 20px;
      background: #fffdf8;
      box-shadow: 0 7px 0 rgba(23, 22, 21, 0.18);
    }

    .identity-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 16px;
    }

    .identity-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    @supports not (color: color-mix(in srgb, red, white)) {
      .skill-hero {
        background: #fffdf8;
      }
    }

    @media (max-width: 1500px) {
      .module-body {
        grid-template-columns: 112px minmax(0, 1fr);
      }

      .module-art {
        width: 112px;
      }

      .module-title {
        font-size: 24px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .page {
        padding-inline: 10px;
      }

      .review-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .phone-shell {
        padding-inline: 0;
      }

      #board {
        width: max-content;
        grid-template-columns: repeat(6, minmax(360px, 1fr));
      }

      .skill-hero {
        min-height: 154px;
        padding: 16px 14px;
      }

      .skill-hero-top {
        grid-template-columns: 62px minmax(0, 1fr) 70px;
      }

      .skill-icon {
        width: 62px;
        height: 62px;
      }

      .skill-title h2 {
        font-size: 28px;
      }

      .regen-ring {
        width: 70px;
        border-width: 6px;
        font-size: 13px;
      }

      .module-stack {
        padding-inline: 9px;
      }

      .module-body {
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 10px;
        padding: 13px;
      }

      .module-art {
        width: 96px;
      }

      .module-title {
        font-size: 22px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body class="docs-theme-dark">
  <header class="docs-bar">
    <div class="docs-bar-head">
      <p class="docs-eyebrow">Idle Elite Godot Docs</p>
      <h1>Godot Action Review</h1>
      <p class="docs-lead">Phone-scroll review of every Idle Elite module in the same order and visual structure used by the Godot skill detail screens.</p>
    </div>
    <nav data-docs-nav></nav>
  </header>
  <main class="page">
    <section class="review-summary" id="summary" aria-label="Action summary"></section>
    <section class="phone-shell" aria-label="Phone action review">
      <div class="phone">
        <div class="phone-status"></div>
        <div id="board"></div>
      </div>
    </section>
  </main>

  <script src="activity-database-data.js"></script>
  <script src="activity-docs.js"></script>
  <script>
    const board = document.getElementById("board");
    const summary = document.getElementById("summary");
    let activityDatabase = null;

    const skillColors = {
      fight: "#e84d4d",
      thieving: "#8956bc",
      build: "#237cd5",
      woodcutting: "#6ea937",
      fishing: "#2dc0b9",
      events: "#d18b28"
    };
    const fishingAreaMaxMethodsPerModule = 3;

    function asset(path) {
      return ActivityDocs.docsAsset(path);
    }

    function cssImage(path) {
      const clean = asset(path);
      return clean ? `url('${clean.replace(/'/g, "%27")}')` : "none";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function stat(value, label) {
      return `<span class="stat"><b>${escapeHtml(value)}</b><span>${escapeHtml(label)}</span></span>`;
    }

    function skillColor(skillId) {
      return skillColors[skillId] || "#3aa0ff";
    }

    function skillName(skillId) {
      const skill = activityDatabase?.skills?.find(entry => entry.id === skillId);
      return skill?.name || skillId;
    }

    function actionSortLevel(action) {
      const level = Number(action.sort_unlock ?? action.unlock ?? 1);
      return Number.isFinite(level) ? Math.max(1, level) : 1;
    }

    function actionRequirements(skill, action) {
      if (Array.isArray(action.requirements) && action.requirements.length) {
        return action.requirements;
      }
      return [{ skill: skill.id, level: action.unlock || 1 }];
    }

    function actionRewards(skill, action) {
      if (action.xp_rewards && typeof action.xp_rewards === "object" && Object.keys(action.xp_rewards).length) {
        return action.xp_rewards;
      }
      return { [skill.id]: action.xp || action.rewards?.xp || 0 };
    }

    function isComboAction(skill, action) {
      const tags = [...(action.combo_tags || []), ...(action.display_tags || [])]
        .map(tag => String(tag).toLowerCase());
      return actionRequirements(skill, action).length > 1 ||
        Object.keys(actionRewards(skill, action)).length > 1 ||
        tags.includes("combo");
    }

    function actionRewardTotal(skill, action) {
      return Object.values(actionRewards(skill, action)).reduce((sum, value) => sum + Number(value || 0), 0);
    }

    function eventDuration(value) {
      const seconds = Number(value);
      if (!Number.isFinite(seconds) || seconds <= 0) return "-";
      if (seconds >= 3600) {
        const hours = seconds / 3600;
        return Number.isInteger(hours) ? `${hours}h` : `${hours.toFixed(1)}h`;
      }
      if (seconds >= 60) return `${Math.round(seconds / 60)}m`;
      return `${Math.round(seconds)}s`;
    }

    function eventMinimumLevel(event) {
      const level = Number(event.minimum_level ?? event.minimum_spawn_level ?? event.min_level ?? event.target_level ?? event.unlock ?? 1);
      return Number.isFinite(level) ? Math.max(1, level) : 1;
    }

    function renderRequirementPills(skill, action, extraClass = "") {
      const className = `pill-line ${extraClass}`.trim();
      return `<div class="${className}">` + actionRequirements(skill, action).map(requirement => {
        const id = requirement.skill || skill.id;
        return `<span class="combo-pill" style="--pill-color:${skillColor(id)}"><small>Lock</small>${escapeHtml(skillName(id))} Lv ${escapeHtml(requirement.level || action.unlock || 1)}</span>`;
      }).join("") + `</div>`;
    }

    function renderRewardPills(skill, action, extraClass = "") {
      const className = `pill-line ${extraClass}`.trim();
      const rewards = actionRewards(skill, action);
      return `<div class="${className}">` + Object.keys(rewards).map(id => {
        return `<span class="reward-pill" style="--pill-color:${skillColor(id)}"><small>XP</small>${escapeHtml(skillName(id))} +${escapeHtml(rewards[id])}</span>`;
      }).join("") + `</div>`;
    }

    function orderedActions(actions) {
      return [...actions]
        .map((action, index) => ({ action, index }))
        .sort((left, right) => {
          const sortDelta = actionSortLevel(left.action) - actionSortLevel(right.action);
          if (sortDelta) return sortDelta;
          const unlockDelta = Number(left.action.unlock || 1) - Number(right.action.unlock || 1);
          if (unlockDelta) return unlockDelta;
          return left.index - right.index || String(left.action.id || "").localeCompare(String(right.action.id || ""));
        })
        .map(entry => entry.action);
    }

    function orderedFishingMethods(actions) {
      return [...actions]
        .map((action, index) => ({ action, index }))
        .sort((left, right) => {
          const unlockDelta = Number(left.action.unlock || 1) - Number(right.action.unlock || 1);
          if (unlockDelta) return unlockDelta;
          const tierDelta = Number(left.action.tier || 1) - Number(right.action.tier || 1);
          return tierDelta || left.index - right.index;
        })
        .map(entry => entry.action);
    }

    function isStandaloneFishingModule(skill, action) {
      return isComboAction(skill, action);
    }

    function fishingAreaUnlock(actions) {
      const unlocks = actions.map(action => Number(action.unlock || 1)).filter(Number.isFinite);
      return unlocks.length ? Math.min(...unlocks) : 1;
    }

    function splitFishingAreaMethods(actions) {
      const methods = orderedFishingMethods(actions);
      const chunks = [];
      for (let start = 0; start < methods.length; start += fishingAreaMaxMethodsPerModule) {
        chunks.push({
          actions: methods.slice(start, start + fishingAreaMaxMethodsPerModule),
          methodStart: start
        });
      }
      return chunks;
    }

    function fishingAreaDisplayName(area, moduleIndex, totalModules) {
      if (totalModules <= 1) return area.name;
      return `${area.name} #${moduleIndex + 1}`;
    }

    function actionSubtitle(skill, action) {
      const requirements = actionRequirements(skill, action);
      if (requirements.length > 1) {
        return requirements.map(requirement => skillName(requirement.skill || skill.id)).join(" + ");
      }
      if (action.area) return `${skill.name} / ${action.area.replaceAll("_", " ")}`;
      return skill.name;
    }

    function renderActionModule(skill, action, index) {
      const progress = 18 + ((index * 17) % 72);
      const combo = isComboAction(skill, action);
      const xpValue = combo ? actionRewardTotal(skill, action) : (action.xp || action.rewards?.xp || 0);
      return `
        <article class="module action-module${combo ? " combo-module" : ""}" style="--skill-color:${skillColor(skill.id)};--bg:${cssImage(action.background)}">
          <div class="module-bg"></div>
          <div class="module-body">
            <img class="module-art" src="${asset(action.art)}" alt="">
            <div class="module-copy">
              <div class="module-kicker">
                <span class="badge">Lv ${escapeHtml(actionSortLevel(action))}</span>
                ${combo ? `<span class="badge combo">Combo</span>` : ""}
                <span class="badge dark">${escapeHtml(actionSubtitle(skill, action))}</span>
              </div>
              <h3 class="module-title">${escapeHtml(action.name)}</h3>
              ${combo ? renderRequirementPills(skill, action) : ""}
              <div class="stat-grid">
                ${stat("+" + xpValue, combo ? "Total XP" : "XP")}
                ${stat(action.stamina, "Stam")}
                ${stat(ActivityDocs.formatSeconds(action.seconds), "Time")}
                ${stat(ActivityDocs.formatPercent(action.success), "Rate")}
              </div>
              ${combo ? renderRewardPills(skill, action) : ""}
              <div class="mastery-line" aria-label="Mastery progress">
                <span class="medal"></span>
                <span class="progress" style="--progress:${progress}%"><span></span></span>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderEventModule(event, index) {
      const ownerSkill = activityDatabase?.skills?.find(skill => skill.id === event.page) || {
        id: event.page || "events",
        name: event.page || "Event"
      };
      const progress = 28 + ((index * 19) % 58);
      const minimumLevel = eventMinimumLevel(event);
      return `
        <article class="module action-module event-module" style="--skill-color:${skillColor(ownerSkill.id)};--bg:${cssImage(event.background)}">
          <div class="module-bg"></div>
          <div class="module-body">
            <img class="module-art" src="${asset(event.art)}" alt="">
            <div class="module-copy">
              <div class="module-kicker">
                <span class="badge event">Event</span>
                <span class="badge dark">${escapeHtml(skillName(ownerSkill.id))}</span>
              </div>
              <h3 class="module-title">${escapeHtml(event.name)}</h3>
              <div class="stat-grid">
                ${stat(event.stamina, "Stam")}
                ${stat(ActivityDocs.formatSeconds(event.seconds), "Time")}
                ${stat(ActivityDocs.formatPercent(event.success), "Rate")}
              </div>
              <div class="pill-line">
                <span class="event-pill"><small>Minimum</small>${escapeHtml(skillName(ownerSkill.id))} Lv ${escapeHtml(minimumLevel)}</span>
                <span class="event-pill"><small>Active</small>${escapeHtml(eventDuration(event.active_duration_seconds))}</span>
                <span class="event-pill"><small>Cooldown</small>${escapeHtml(eventDuration(event.respawn_cooldown_seconds))}</span>
                <span class="event-pill"><small>Weight</small>${escapeHtml(event.spawn_weight ?? "-")}</span>
              </div>
              <div class="mastery-line" aria-label="Event progress">
                <span class="medal"></span>
                <span class="progress" style="--progress:${progress}%"><span></span></span>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderPassiveModule(skill, action) {
      const passive = action.passive || {};
      const capacity = passive.base_capacity || passive.capacity || 0;
      const seconds = passive.base_time_seconds || passive.time_seconds || action.seconds;
      const yieldValue = passive.base_yield || passive.yield || 1;
      return `
        <article class="module passive" style="--skill-color:${skillColor(skill.id)};--bg:${cssImage(action.background || action.art)}">
          <div class="module-bg"></div>
          <div class="module-body">
            <img class="module-art" src="${asset(action.art)}" alt="">
            <div class="module-copy">
              <div class="module-kicker">
                <span class="badge">Lv ${escapeHtml(action.unlock)}</span>
                <span class="badge dark">Passive module</span>
              </div>
              <h3 class="module-title">${escapeHtml(action.name)}</h3>
              <div class="passive-grid">
                <span class="upgrade-pill">${escapeHtml(yieldValue)}<span>Yield</span></span>
                <span class="upgrade-pill">${escapeHtml(ActivityDocs.formatSeconds(seconds))}<span>Cycle</span></span>
                <span class="upgrade-pill">${escapeHtml(capacity)}<span>Max</span></span>
              </div>
              <div class="mastery-line" aria-label="Storage progress">
                <span class="medal"></span>
                <span class="progress" style="--progress:46%"><span></span></span>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderFishingAreaModule(skill, area, actions, index, moduleIndex = 0, totalModules = 1, methodStart = 0) {
      const unlock = fishingAreaUnlock(actions);
      const fluid = area.fluid ? area.fluid.replaceAll("_", " ") : "water";
      const methods = orderedFishingMethods(actions);
      const displayName = fishingAreaDisplayName(area, moduleIndex, totalModules);
      return `
        <article class="module area-module" style="--skill-color:${skillColor(skill.id)};--bg:${cssImage(area.background)}">
          <div class="module-bg"></div>
          <div class="module-body">
            <div class="area-top">
              <span class="area-thumb" style="--bg:${cssImage(area.background)}"></span>
              <div class="module-copy">
                <div class="module-kicker">
                  <span class="badge">Lv ${escapeHtml(unlock)}</span>
                  <span class="badge dark">${escapeHtml(fluid)}</span>
                </div>
                <h3 class="module-title">${escapeHtml(displayName)}</h3>
              </div>
            </div>
            <div class="method-list">
              ${methods.map((action, methodIndex) => {
                const combo = isComboAction(skill, action);
                const xpValue = combo ? actionRewardTotal(skill, action) : (action.xp || action.rewards?.xp || 0);
                return `
                <div class="method-row${combo ? " combo-method" : ""}">
                  <div>
                    <strong>${escapeHtml(action.name)}</strong>
                    <span>Method ${methodStart + methodIndex + 1} / Lv ${escapeHtml(actionSortLevel(action))} / ${escapeHtml(ActivityDocs.formatPercent(action.success))}</span>
                    ${combo ? renderRequirementPills(skill, action, "method-pills") : ""}
                    ${combo ? renderRewardPills(skill, action, "method-pills") : ""}
                  </div>
                  <div class="method-stat">+${escapeHtml(xpValue)} XP</div>
                </div>
              `;
              }).join("")}
            </div>
            <div class="mastery-line" aria-label="Area progress">
              <span class="medal"></span>
              <span class="progress" style="--progress:${24 + ((index * 13) % 60)}%"><span></span></span>
            </div>
          </div>
        </article>
      `;
    }

    function renderSkillHeader(skill, modules) {
      return `
        <header class="skill-hero">
          <div class="skill-hero-top">
            <img class="skill-icon" src="${asset(skill.icon)}" alt="">
            <div class="skill-title">
              <h2>${escapeHtml(skill.name)}</h2>
              <p>${escapeHtml(skill.identity)}</p>
            </div>
            <div class="regen-ring">${modules}</div>
          </div>
          <div class="xp-strip"><span></span></div>
        </header>
      `;
    }

    function renderFishingSkill(skill) {
      const passiveModules = orderedActions(skill.actions.filter(action => action.kind === "passive_item_collect"));
      const activeActions = skill.actions.filter(action => action.kind !== "passive_item_collect");
      const areas = Array.isArray(skill.areas) ? skill.areas : [];
      const areaIds = new Set(areas.map(area => String(area.id || "")));
      const standaloneActions = orderedActions(activeActions.filter(action => {
        return isStandaloneFishingModule(skill, action) || !areaIds.has(String(action.area || ""));
      }));
      const areaPlans = areas.flatMap((area, index) => {
        const areaActions = activeActions.filter(action => action.area === area.id && !isStandaloneFishingModule(skill, action));
        if (!areaActions.length) return [];
        const chunks = splitFishingAreaMethods(areaActions);
        return chunks.map((chunk, moduleIndex) => ({
          type: "area",
          sort: fishingAreaUnlock(chunk.actions),
          order: index * 100 + moduleIndex,
          html: renderFishingAreaModule(skill, area, chunk.actions, index * 10 + moduleIndex, moduleIndex, chunks.length, chunk.methodStart)
        }));
      });
      const standalonePlans = standaloneActions.map((action, index) => ({
        type: "standalone",
        sort: actionSortLevel(action),
        order: areas.length + index,
        html: renderActionModule(skill, action, index)
      }));
      const fishingPlans = [...areaPlans, ...standalonePlans].sort((left, right) => {
        const sortDelta = left.sort - right.sort;
        return sortDelta || left.order - right.order;
      });
      const modules = passiveModules.length + fishingPlans.length;
      return `
        <section class="skill-screen" style="--skill-color:${skillColor(skill.id)}">
          ${renderSkillHeader(skill, modules)}
          <div class="module-stack">
            ${passiveModules.map(action => renderPassiveModule(skill, action)).join("")}
            ${fishingPlans.map(plan => plan.html).join("")}
            <article class="identity-card">
              <strong>${escapeHtml(skill.name)} identity</strong>
              <p>${escapeHtml(skill.identity)}</p>
            </article>
          </div>
        </section>
      `;
    }

    function renderSkill(skill) {
      if (skill.id === "fishing") return renderFishingSkill(skill);
      const actions = orderedActions(skill.actions);
      const modules = actions.length;
      return `
        <section class="skill-screen" style="--skill-color:${skillColor(skill.id)}">
          ${renderSkillHeader(skill, modules)}
          <div class="module-stack">
            ${actions.map((action, index) => {
              if (action.kind === "passive_item_collect") return renderPassiveModule(skill, action);
              return renderActionModule(skill, action, index);
            }).join("")}
            <article class="identity-card">
              <strong>${escapeHtml(skill.name)} identity</strong>
              <p>${escapeHtml(skill.identity)}</p>
            </article>
          </div>
        </section>
      `;
    }

    function renderEventScreen(database) {
      const events = orderedActions(database.event_modules || []);
      if (!events.length) return "";
      const eventSkill = {
        id: "events",
        name: "Random Events",
        identity: "Temporary one-shot modules grouped here for visual review.",
        icon: "assets/content/ui/progress-star-icon.png"
      };
      return `
        <section class="skill-screen" style="--skill-color:${skillColor(eventSkill.id)}">
          ${renderSkillHeader(eventSkill, events.length)}
          <div class="module-stack">
            ${events.map(renderEventModule).join("")}
            <article class="identity-card">
              <strong>Random event identity</strong>
              <p>These modules can spawn into their owning skill page, then despawn after a successful completion.</p>
            </article>
          </div>
        </section>
      `;
    }

    function renderSummary(database) {
      const skills = database.skills.length;
      const actions = database.skills.reduce((sum, skill) => sum + skill.actions.length, 0);
      const combos = database.skills.reduce((sum, skill) => sum + skill.actions.filter(action => isComboAction(skill, action)).length, 0);
      const events = (database.event_modules || []).length;
      const passive = database.skills.reduce((sum, skill) => sum + skill.actions.filter(action => action.kind === "passive_item_collect").length, 0);
      const fishingAreas = (database.skills.find(skill => skill.id === "fishing")?.areas || []).length;
      summary.innerHTML = `
        <article class="summary-tile"><strong>${skills}</strong><span>Skills</span></article>
        <article class="summary-tile"><strong>${actions}</strong><span>Actions</span></article>
        <article class="summary-tile"><strong>${combos}</strong><span>Combo modules</span></article>
        <article class="summary-tile"><strong>${events}</strong><span>Random events</span></article>
        <article class="summary-tile"><strong>${passive}</strong><span>Passive modules</span></article>
        <article class="summary-tile"><strong>${fishingAreas}</strong><span>Fishing areas</span></article>
      `;
    }

    async function boot() {
      try {
        activityDatabase = await ActivityDocs.loadDatabase();
        renderSummary(activityDatabase);
        board.innerHTML = activityDatabase.skills.map(renderSkill).join("") + renderEventScreen(activityDatabase);
      } catch (error) {
        ActivityDocs.renderError(board, error);
        summary.innerHTML = "";
      }
    }

    boot();
  </script>
  <script src="docs-nav.js?v=nav-clean-20260603"></script>
</body>
</html>
