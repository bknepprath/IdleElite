<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fishing Area Art Review</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f0df;
      --paper: #fffaf0;
      --panel: #fff8e8;
      --panel-2: #f0e3c5;
      --ink: #253029;
      --muted: #6f7567;
      --line: #d7c59f;
      --ok: #217b4a;
      --bad: #b9402d;
      --accent: #2c7191;
      --shadow: rgba(88, 68, 32, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.52), transparent 360px),
        var(--bg);
      color: var(--ink);
      cursor: grab;
      user-select: none;
      overscroll-behavior: contain;
    }

    body.dragging {
      cursor: grabbing;
    }

    header {
      padding: 28px clamp(18px, 4vw, 44px) 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.92);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subhead {
      margin: 0;
      max-width: 980px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      align-items: center;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    button:hover { border-color: var(--accent); }

    .counter {
      color: var(--muted);
      font-weight: 700;
      margin-left: auto;
    }

    main {
      padding: 26px clamp(14px, 3vw, 36px) 44px;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .asset {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(180px, 1fr) 132px minmax(240px, 1.1fr);
      align-items: stretch;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: clip;
      min-height: 226px;
      box-shadow: 0 10px 26px var(--shadow);
    }

    .asset[data-status="accepted"] {
      background: #ebe3cf;
      border-color: rgba(125, 132, 117, 0.75);
      box-shadow: none;
      opacity: 0.62;
    }

    .asset[data-status="accepted"] .preview img {
      filter: grayscale(0.88) saturate(0.32) contrast(0.9);
    }

    .asset[data-status="accepted"] .body,
    .asset[data-status="accepted"] .status,
    .asset[data-status="accepted"] .comment-cell {
      filter: grayscale(0.8);
    }

    .asset[data-status="accepted"]:hover {
      opacity: 0.9;
    }

    .asset[data-status="rejected"] { border-color: rgba(185, 64, 45, 0.75); }

    .preview {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 224px;
      padding: 14px;
      background: #eadbb9;
      border-right: 1px solid var(--line);
    }

    .preview.full { aspect-ratio: 16 / 9; }
    .preview.square { aspect-ratio: auto; }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(74, 54, 21, 0.18);
    }

    .preview.square img {
      width: min(100%, 210px);
      height: min(100%, 210px);
      aspect-ratio: 1 / 1;
    }

    .empty {
      color: #82745d;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
    }

    .body {
      padding: 14px;
      display: grid;
      gap: 8px;
      align-content: center;
    }

    .asset h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .status {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      border-left: 1px solid var(--line);
      justify-content: center;
    }

    label.choice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 8px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      min-width: 0;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 108px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf7;
      color: var(--ink);
      padding: 10px;
      font: inherit;
      line-height: 1.35;
      user-select: text;
    }

    .comment-cell,
    .path-cell {
      padding: 14px;
      border-left: 1px solid var(--line);
    }

    .comment-cell {
      display: grid;
      align-items: stretch;
    }

    .path-cell {
      display: grid;
      align-content: center;
      gap: 8px;
    }

    .accepted-name {
      color: var(--ok);
      font-weight: 800;
      min-height: 18px;
      font-size: 13px;
    }

    .path {
      color: #8ca49b;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.35;
      user-select: text;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(13, 19, 18, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.36);
      color: #f8f0dc;
      font-size: 12px;
      font-weight: 900;
    }

    @media (max-width: 980px) {
      .asset {
        grid-template-columns: minmax(0, 1fr);
      }

      .status,
      .comment-cell {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .preview {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .status {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Fishing Area Art Review</h1>
    <p class="subhead">Living checklist for new Idle Elite fishing art. Each area gets one full background plate and one square area tile. Your accept/reject choices and comments save in this browser with local storage. Reject plus feedback means generate a tweaked replacement.</p>
    <div class="toolbar">
      <button type="button" id="showRejected">Show Rejected</button>
      <button type="button" id="showAll">Show All</button>
      <button type="button" id="exportState">Export Review JSON</button>
      <span class="counter" id="counter">0 / 20 accepted</span>
    </div>
  </header>

  <main>
    <section class="grid" id="assetGrid" aria-label="Fishing asset checklist"></section>
  </main>

  <script>
    const assets = [
      ["beach-background", "Beach", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/00-tide-pool-shallows.png", "docs/art-source/asset-sources/fishing-area-art-review/beach-background-v1.png"],
      ["beach-shallows-square", "Beach", "Shallows", "Location Square", "square", "assets/content/fishing/locations/location-shallows.png", "docs/art-source/asset-sources/fishing-area-art-review/beach-shallows-square-v2.png"],
      ["beach-rocks-square", "Beach", "Rocks", "Location Square", "square", "assets/content/fishing/locations/location-rocky-ledge.png", "docs/art-source/asset-sources/fishing-area-art-review/beach-rocks-square-v2.png"],
      ["pier-background", "Pier", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/01-pond-dock.png", "docs/art-source/asset-sources/fishing-area-art-review/pier-background-v1.png"],
      ["pier-dock-edge-square", "Pier", "Dock Edge", "Location Square", "square", "assets/content/fishing/locations/location-dock-cup.png", "docs/art-source/asset-sources/fishing-area-art-review/pier-dock-edge-square-v1.png"],
      ["pier-piling-line-square", "Pier", "Piling Line", "Location Square", "square", "assets/content/fishing/locations/location-piling-line.png", "docs/art-source/asset-sources/fishing-area-art-review/pier-piling-line-square-v3.png"],
      ["pier-anchor-tiny-boat-dock-square", "Pier", "Anchor Tiny Boat Dock", "Combo Module Art", "square", "assets/content/fishing/actions/12-trawl-from-tiny-boat.png", "docs/art-source/asset-sources/fishing-area-art-review/pier-anchor-tiny-boat-dock-square-v3.png"],
      ["river-background", "River", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/02-river-bend.png", "docs/art-source/asset-sources/fishing-area-art-review/river-background-v1.png"],
      ["river-bend-square", "River", "River Bend", "Location Square", "square", "assets/content/fishing/locations/river-bend.png", "docs/art-source/asset-sources/fishing-area-art-review/river-bend-square-v1.png"],
      ["river-rapids-square", "River", "Rapids", "Location Square", "square", "assets/content/fishing/locations/river-rapids.png", "docs/art-source/asset-sources/fishing-area-art-review/river-rapids-square-v1.png"],
      ["sewers-background", "Sewers", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/sewer-pipe-outlet.png", "docs/art-source/asset-sources/fishing-area-art-review/sewers-background-v3.png"],
      ["sewers-drain-gate-square", "Sewers", "Drain Gate", "Location Square", "square", "assets/content/fishing/locations/sewers-drain-gate.png", "docs/art-source/asset-sources/fishing-area-art-review/sewers-drain-gate-square-v4.png"],
      ["sewers-fight-rat-king-square", "Sewers", "Fight Rat King", "Combo Module Art", "square", "assets/content/combo/fishing/actions/fight-rat-king.png", "docs/art-source/asset-sources/fishing-area-art-review/sewers-fight-rat-king-square-v1.png"],
      ["sewers-tunnel-pool-square", "Sewers", "Tunnel Pool", "Location Square", "square", "assets/content/fishing/locations/sewers-tunnel-pool.png", "docs/art-source/asset-sources/fishing-area-art-review/sewers-tunnel-pool-square-v1.png"],
      ["winter-lake-background", "Winter Lake", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/04-frozen-lake.png", "docs/art-source/asset-sources/fishing-area-art-review/winter-lake-background-v2.png"],
      ["winter-lake-ice-hole-square", "Winter Lake", "Ice Hole", "Location Square", "square", "assets/content/fishing/locations/winter-lake-ice-hole.png", "docs/art-source/asset-sources/fishing-area-art-review/winter-lake-ice-hole-square-v9.png"],
      ["reef-background", "Reef", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/05-coral-reef-shallows.png", "docs/art-source/asset-sources/fishing-area-art-review/reef-background-v1.png"],
      ["reef-pot-square", "Reef", "Reef Pot", "Location Square", "square", "assets/content/fishing/locations/reef-pot.png", "docs/art-source/asset-sources/fishing-area-art-review/reef-pot-square-v4.png"],
      ["reef-fight-armored-catfish-square", "Reef", "Fight Armored Catfish", "Combo Module Art", "square", "assets/content/combo/fishing/actions/fight-armored-catfish.png", "docs/art-source/asset-sources/fishing-area-art-review/reef-fight-armored-catfish-square-v3.png"],
      ["reef-cage-square", "Reef", "Reef Cage", "Location Square", "square", "assets/content/fishing/locations/reef-cage.png", "docs/art-source/asset-sources/fishing-area-art-review/reef-cage-square-v1.png"],
      ["reef-night-reef-square", "Reef", "Night Reef", "Location Square", "square", "assets/content/fishing/locations/reef-night-reef.png", "docs/art-source/asset-sources/fishing-area-art-review/reef-night-reef-square-v1.png"],
      ["reef-pearl-bed-square", "Reef", "Pearl Bed", "Location Square", "square", "assets/content/fishing/locations/reef-pearl-bed.png", "docs/art-source/asset-sources/fishing-area-art-review/reef-pearl-bed-square-v1.png"],
      ["sea-background", "Sea", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/07-rowboat-offshore.png", "docs/art-source/asset-sources/fishing-area-art-review/sea-background-v2.png"],
      ["sea-rowboat-square", "Sea", "Rowboat", "Location Square", "square", "assets/content/fishing/locations/sea-rowboat.png", "docs/art-source/asset-sources/fishing-area-art-review/sea-rowboat-square-v1.png"],
      ["sea-open-water-square", "Sea", "Open Water", "Location Square", "square", "assets/content/fishing/locations/sea-open-water.png", "docs/art-source/asset-sources/fishing-area-art-review/sea-open-water-square-v1.png"],
      ["sea-fight-shark-square", "Sea", "Fight A Shark", "Combo Module Art", "square", "assets/content/combo/fishing/actions/fight-a-shark.png", "docs/art-source/asset-sources/fishing-area-art-review/sea-fight-shark-square-v1.png"],
      ["sea-loot-pirate-ship-square", "Sea", "Loot A Pirate Ship", "Combo Module Art", "square", "assets/content/combo/fishing/actions/loot-a-pirate-ship.png", "docs/art-source/asset-sources/fishing-area-art-review/sea-loot-pirate-ship-square-v1.png"],
      ["sea-chum-line-square", "Sea", "Chum Line", "Location Square", "square", "assets/content/fishing/locations/sea-chum-line.png", "docs/art-source/asset-sources/fishing-area-art-review/sea-chum-line-square-v1.png"],
      ["stormy-sea-background", "Stormy Sea", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/10-storm-ocean.png", "docs/art-source/asset-sources/fishing-area-art-review/stormy-sea-background-v1.png"],
      ["stormy-sea-ripple-square", "Stormy Sea", "Storm Ripple", "Location Square", "square", "assets/content/fishing/locations/stormy-sea-ripple.png", "docs/art-source/asset-sources/fishing-area-art-review/stormy-sea-ripple-square-v1.png"],
      ["stormy-sea-storm-line-square", "Stormy Sea", "Storm Line", "Location Square", "square", "assets/content/fishing/locations/stormy-sea-storm-line.png", "docs/art-source/asset-sources/fishing-area-art-review/stormy-sea-storm-line-square-v3.png"],
      ["deep-sea-background", "Deep Sea", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/09-deep-sea-abyss.png", "docs/art-source/asset-sources/fishing-area-art-review/deep-sea-background-v1.png"],
      ["deep-sea-wreck-drop-square", "Deep Sea", "Wreck Drop", "Location Square", "square", "assets/content/fishing/locations/deep-sea-wreck-drop.png", "docs/art-source/asset-sources/fishing-area-art-review/deep-sea-wreck-drop-square-v1.png"],
      ["deep-sea-abyss-square", "Deep Sea", "Abyss", "Location Square", "square", "assets/content/fishing/locations/deep-sea-abyss.png", "docs/art-source/asset-sources/fishing-area-art-review/deep-sea-abyss-square-v1.png"],
      ["deep-sea-trench-square", "Deep Sea", "Deep Trench", "Location Square", "square", "assets/content/fishing/locations/deep-sea-trench.png", "docs/art-source/asset-sources/fishing-area-art-review/deep-sea-trench-square-v1.png"],
      ["space-background", "Space Fishing", "Module background", "Full Background", "full", "assets/content/fishing/backgrounds/11-cosmic-dream-sea.png", "docs/art-source/asset-sources/fishing-area-art-review/space-background-v1.png"],
      ["space-starlight-square", "Space Fishing", "Starlight", "Location Square", "square", "assets/content/fishing/locations/space-starlight.png", "docs/art-source/asset-sources/fishing-area-art-review/space-starlight-square-v1.png"],
      ["space-reflection-square", "Space Fishing", "Reflection", "Location Square", "square", "assets/content/fishing/locations/space-reflection.png", "docs/art-source/asset-sources/fishing-area-art-review/space-reflection-square-v3.png"]
    ].map(([id, area, name, kind, shape, gamePath, reviewPath]) => ({ id, area, name, kind, shape, gamePath, reviewPath }));

    const stateKey = "idleEliteFishingAreaArtReview.v1";
    const grid = document.querySelector("#assetGrid");
    const counter = document.querySelector("#counter");
    const storedState = JSON.parse(localStorage.getItem(stateKey) || "{}");

    function saveState() {
      localStorage.setItem(stateKey, JSON.stringify(storedState, null, 2));
      updateCounter();
    }

    function statusFor(id) {
      const row = storedState[id] || {};
      if (row.accepted) return "accepted";
      if (row.rejected) return "rejected";
      return "pending";
    }

    function updateCounter() {
      const accepted = assets.filter(asset => storedState[asset.id]?.accepted).length;
      counter.textContent = `${accepted} / ${assets.length} accepted`;
      document.querySelectorAll(".asset").forEach(card => {
        card.dataset.status = statusFor(card.dataset.id);
        const acceptedName = card.querySelector(".accepted-name");
        const asset = assets.find(item => item.id === card.dataset.id);
        acceptedName.textContent = storedState[asset.id]?.accepted ? `Accepted: ${asset.reviewPath.split("/").pop()}` : "";
      });
    }

    function resetReview(assetId) {
      const row = storedState[assetId] || {};
      row.accepted = false;
      row.rejected = false;
      row.comment = "";
      storedState[assetId] = row;
      saveState();
      const card = document.querySelector(`.asset[data-id="${assetId}"]`);
      if (!card) return;
      card.querySelector(".done").checked = false;
      card.querySelector(".accepted").checked = false;
      card.querySelector(".rejected").checked = false;
      card.querySelector("textarea").value = "";
    }

    window.resetAssetReview = resetReview;

    function imageExists(path, img, empty) {
      img.onload = () => {
        img.hidden = false;
        empty.hidden = true;
      };
      img.onerror = () => {
        img.hidden = true;
        empty.hidden = false;
      };
      img.src = "/" + path;
    }

    function render() {
      grid.innerHTML = "";
      assets.forEach(asset => {
        let row = storedState[asset.id] || {};
        const isNewerCandidate = /-v[2-9]\d*\.png$/.test(asset.reviewPath);
        if ((row.candidatePath && row.candidatePath !== asset.reviewPath) || (!row.candidatePath && isNewerCandidate)) {
          row = {};
        }
        row.candidatePath = asset.reviewPath;
        storedState[asset.id] = row;
        const card = document.createElement("article");
        card.className = "asset";
        card.dataset.id = asset.id;
        card.dataset.status = statusFor(asset.id);
        card.innerHTML = `
          <div class="preview ${asset.shape}">
            <span class="badge">${asset.kind}</span>
            <img alt="${asset.area} ${asset.name}" hidden>
            <span class="empty">Not generated yet</span>
          </div>
          <div class="body">
            <h2><input type="checkbox" class="done" ${row.accepted ? "checked" : ""}> ${asset.area} - ${asset.name}</h2>
            <div class="meta">${asset.kind}</div>
            <div class="accepted-name"></div>
          </div>
            <div class="status">
              <label class="choice"><input type="checkbox" class="accepted" ${row.accepted ? "checked" : ""}> Accept</label>
              <label class="choice"><input type="checkbox" class="rejected" ${row.rejected ? "checked" : ""}> Reject</label>
            </div>
          <div class="comment-cell">
            <textarea placeholder="Feedback for the next try...">${row.comment || ""}</textarea>
          </div>
        `;

        const img = card.querySelector("img");
        const empty = card.querySelector(".empty");
        imageExists(asset.reviewPath, img, empty);

        const accepted = card.querySelector(".accepted");
        const rejected = card.querySelector(".rejected");
        const done = card.querySelector(".done");
        const textarea = card.querySelector("textarea");

        function ensureRow() {
          storedState[asset.id] ||= {};
          storedState[asset.id].candidatePath = asset.reviewPath;
          return storedState[asset.id];
        }

        accepted.addEventListener("change", () => {
          const item = ensureRow();
          item.accepted = accepted.checked;
          if (accepted.checked) {
            item.rejected = false;
            rejected.checked = false;
            done.checked = true;
          }
          saveState();
        });

        done.addEventListener("change", () => {
          const item = ensureRow();
          item.accepted = done.checked;
          accepted.checked = done.checked;
          if (done.checked) {
            item.rejected = false;
            rejected.checked = false;
          }
          saveState();
        });

        rejected.addEventListener("change", () => {
          const item = ensureRow();
          item.rejected = rejected.checked;
          if (rejected.checked) {
            item.accepted = false;
            accepted.checked = false;
            done.checked = false;
          }
          saveState();
        });

        textarea.addEventListener("input", () => {
          ensureRow().comment = textarea.value;
          saveState();
        });

        grid.append(card);
      });
      saveState();
      updateCounter();
    }

    document.querySelector("#showRejected").addEventListener("click", () => {
      document.querySelectorAll(".asset").forEach(card => {
        card.hidden = statusFor(card.dataset.id) !== "rejected";
      });
    });

    document.querySelector("#showAll").addEventListener("click", () => {
      document.querySelectorAll(".asset").forEach(card => card.hidden = false);
    });

    document.querySelector("#exportState").addEventListener("click", async () => {
      const review = assets.map(asset => ({ ...asset, review: storedState[asset.id] || {} }));
      await navigator.clipboard.writeText(JSON.stringify(review, null, 2));
      counter.textContent = "Review JSON copied";
      setTimeout(updateCounter, 1200);
    });

    render();

    let dragStartX = 0;
    let dragStartY = 0;
    let scrollStartX = 0;
    let scrollStartY = 0;
    let isDraggingPage = false;

    function canStartPageDrag(event) {
      return !event.target.closest("button, input, textarea, label, a");
    }

    window.addEventListener("pointerdown", event => {
      if (!canStartPageDrag(event)) return;
      isDraggingPage = true;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      scrollStartX = window.scrollX;
      scrollStartY = window.scrollY;
      document.body.classList.add("dragging");
      window.setPointerCapture?.(event.pointerId);
    });

    window.addEventListener("pointermove", event => {
      if (!isDraggingPage) return;
      event.preventDefault();
      window.scrollTo(
        scrollStartX - (event.clientX - dragStartX),
        scrollStartY - (event.clientY - dragStartY)
      );
    }, { passive: false });

    window.addEventListener("pointerup", () => {
      isDraggingPage = false;
      document.body.classList.remove("dragging");
    });

    window.addEventListener("pointercancel", () => {
      isDraggingPage = false;
      document.body.classList.remove("dragging");
    });
  </script>
</body>
</html>
